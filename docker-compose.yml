services:
  postgres:
    image: postgres:15-alpine
    container_name: food-recipe-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-food_recipe}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-food_recipe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  hasura:
    image: hasura/graphql-engine:v2.44.0
    container_name: food-recipe-hasura
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-food_recipe}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-myadminsecretkey}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${HASURA_JWT_SECRET:-my-super-secret-jwt-key-food-recipe-2026}"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "anon"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-recipe-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - hasura
    environment:
      PORT: "8000"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      CALLBACK_URL: "${CALLBACK_URL:-http://localhost:8000/v1/payment/verify}"
      HASURA_URL: "http://hasura:8080/v1/graphql"
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET:-myadminsecretkey}"
      HASURA_JWT_SECRET: "${HASURA_JWT_SECRET:-my-super-secret-jwt-key-food-recipe-2026}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
      CHAPA_SECRET_KEY: "${CHAPA_SECRET_KEY:-}"

volumes:
  postgres_data:
